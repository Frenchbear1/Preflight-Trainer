<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1218">
<title>Preflight Trainer · Piper Pilot 100i</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ctext y=%2226%22 font-size=%2226%22%3E%E2%9C%88%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="view"></canvas>

<header id="top">
  <div class="brand"><b>Preflight Trainer</b><span>PA-28-181 Piper Pilot 100i</span></div>
  <nav class="seg" id="viewSeg">
    <button data-view="outside" class="on">Outside</button>
    <button data-view="cockpit">Cockpit</button>
  </nav>
  <div class="tools">
    <button id="btnParts" title="Find a part">Parts</button>
    <button id="btnReset" title="Put everything back to parked">Reset</button>
  </div>
</header>

<aside id="card" hidden>
  <div class="card-head"><div><h2 id="cardName"></h2><div id="cardRef"></div></div><button id="cardClose" aria-label="Close">✕</button></div>
  <p id="cardText"></p>
  <div id="cardState"></div>
  <div id="cardActions"></div>
</aside>

<aside id="parts" hidden>
  <div class="card-head"><h2>Parts</h2><button id="partsClose" aria-label="Close">✕</button></div>
  <input id="partsSearch" placeholder="Search parts" autocomplete="off">
  <div id="partsList"></div>
</aside>

<div id="hint">Drag to look around · pinch to zoom · tap any part</div>
<div id="loading">Building the airplane…</div>
<footer id="note">Study aid built from POH VB-2960. The airplane's own POH and placards always come first.</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
